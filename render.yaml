databases:
  - name: wusool-demo-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "17"
    databaseName: wusool_demo
    user: wusool_demo
    ipAllowList: []

services:
  - type: web
    name: wusool-demo-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: npm ci && npm run prisma:generate && npm run build && npm prune --omit=dev
    startCommand: npm run deploy:start
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_ENV
        value: staging
      - key: DATABASE_URL
        fromDatabase:
          name: wusool-demo-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 30m
      - key: JWT_REFRESH_TTL
        value: 7d
      - key: CORS_ALLOWED_ORIGINS
        value: https://wusool-demo-api.onrender.com
      - key: TRUST_PROXY
        value: 1
      - key: LOGIN_RATE_LIMIT
        value: 10
      - key: ATTENDANCE_CUTOFF
        value: 23:59
      - key: LOG_LEVEL
        value: info
      - key: ALLOW_DEMO_DEPLOYMENT
        value: true
      - key: PUBLIC_STUDENT_REGISTRATION
        value: false
      - key: ALLOW_DEMO_SEED
        value: true
      - key: ALLOW_REMOTE_DEMO_SEED
        value: true
      - key: DEMO_PASSWORD
        sync: false
