services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - backend/.env.local.e2e
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - wasl_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  wasl_postgres_data:
    name: wasl_postgres_data
